<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lean Startup | Premium Landing Page</title>
    <!-- Google Fonts: Serif for vintage quotes, Sans for modern body -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="vintage-overlay"></div>

    <div class="container">
        <!-- Top Quote Section from image_da7aa2.jpg -->
        <header class="top-quote">
            <span class="quote-mark">“</span>
            <p>Every so often a book comes along that changes how we think... this is that book.</p>
            <span class="quote-mark">”</span>
            <cite>THE FINANCIAL TIMES</cite>
        </header>

        <!-- Main Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <div class="book-container">
                    <!-- This will hold your 3D mockup later -->
                    <img src="book-mockup.png" alt="Book 3D Mockup" class="book-mockup">
                </div>

                <div class="text-container">
                    <h1>THE LEAN <br><span class="highlight">STARTUP</span></h1>
                    <p class="description">How Today's Entrepreneurs Use Continuous Innovation to Create Radically Successful Businesses</p>
                    
                    <div class="button-group">
                        <button id="orderBtn" class="order-now">Order Now</button>
                        <a href="https://shersstudycentre.github.io/home/" class="study-centre">ShersStudyCentre</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Reviews Section -->
        <section class="reviews-section">
            <h2>Reader Reviews</h2>
            <hr class="vintage-hr">
            <div id="reviews-grid" class="reviews-grid">
                <!-- JavaScript will inject cards here -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
